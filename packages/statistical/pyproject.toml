[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speculative-evaluation"
version = "0.0.1"
description = "Statistical reproduction of Speculative Evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.3",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
spec-eval = "speculative_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speculative_eval"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../tests/statistical"]
addopts = "-q"
