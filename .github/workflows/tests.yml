name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: packages/statistical/.python-version
      - run: make setup
      - run: make test
      - run: make audit
      - run: make benchmarks BENCHMARK_ARGS="--plan"

  systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: make systems-setup systems-test
      - run: uv run --project packages/systems --locked make paper-tables
